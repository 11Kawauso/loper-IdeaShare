<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loper - IdeaShare</title>
<meta name="description" content="loper IdeaShare - 開発のアイデアを気軽に共有するボード">
<link rel="icon" href="images/loper_MainIcon.png">
<link rel="stylesheet" href="idea.css">
</head>
<body>

<div class="frame">
  <div class="app">

    <!-- ============ サイドバー ============ -->
    <aside class="sidebar">
      <button type="button" class="brand" data-view="home" aria-label="ホームの先頭へ">
        <img src="images/loper-IdeaShare_logo.png" alt="loper IdeaShare">
      </button>

      <nav class="nav" aria-label="メインナビゲーション">
        <button type="button" class="nav-item is-active" data-view="home" aria-current="page">ホーム</button>
        <button type="button" class="nav-item" data-view="search">検索</button>
        <button type="button" class="nav-item" data-view="notice">通知<span class="nav-badge" id="noticeBadge" hidden>0</span></button>
        <button type="button" class="nav-item" data-view="liked"><span class="nav-dot like"></span>いいねした投稿</button>
        <button type="button" class="nav-item" data-view="dev"><span class="nav-dot dev"></span>開発中の投稿</button>
        <button type="button" class="nav-item" data-view="done"><span class="nav-dot done"></span>完成した投稿</button>
        <button type="button" class="nav-item" data-view="settings">設定</button>
      </nav>

      <button type="button" class="profile-chip" data-view="profile">
        <span class="avatar" id="myAvatar">n</span>
        <span class="profile-name" id="myName">name</span>
      </button>
    </aside>

    <!-- ============ メインカラム ============ -->
    <main class="main">

      <!-- ホーム -->
      <section class="view is-active" id="view-home">
        <!-- 投稿欄と凡例は画面上部に固定する -->
        <div class="feed-top">
        <div class="composer">
          <button type="button" class="composer-open" id="composerOpen">
            <span class="avatar avatar-sm" id="composerAvatar">n</span>
            <span class="composer-placeholder">アイデアを投稿する</span>
          </button>

          <form class="composer-form" id="ideaForm" hidden>
            <textarea id="ideaTextInput" maxlength="300" rows="3"
                      placeholder="どんなアイデアでもOKです" required></textarea>
            <div class="composer-actions">
              <span class="char-counter" id="charCounter">0 / 300</span>
              <div class="composer-buttons">
                <button type="button" class="btn btn-ghost" id="composerCancel">キャンセル</button>
                <button type="submit" class="btn btn-primary">投稿する</button>
              </div>
            </div>
          </form>
        </div>

        <div class="legend">
          <span class="legend-item"><span class="legend-dot done"></span>完成した数</span>
          <span class="legend-item"><span class="legend-dot dev"></span>開発中の数</span>
          <span class="legend-item"><span class="legend-dot like"></span>いいね</span>
        </div>
        </div><!-- /.feed-top -->

        <div class="feed" id="feed"></div>

        <!-- 無限スクロールの読み込み位置。ここが見えたら次のページを追加する -->
        <div class="feed-end" id="feedEnd" aria-live="polite"></div>
      </section>

      <!-- 検索 -->
      <section class="view" id="view-search">
        <h2 class="view-title">検索</h2>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.7" y2="16.7"></line></svg>
          <input type="search" id="searchInput" placeholder="キーワード・投稿者名で検索" autocomplete="off">
        </div>
        <p class="search-hint" id="searchHint">キーワードを入力すると投稿を絞り込みます。</p>
        <div class="feed" id="searchResults"></div>
      </section>

      <!-- プロフィール -->
      <section class="view" id="view-profile">
        <h2 class="view-title">プロフィール</h2>

        <div class="profile-preview">
          <span class="avatar avatar-lg" id="profileAvatar">n</span>
          <div class="profile-preview-body">
            <div class="profile-preview-name" id="profilePreviewName">name</div>
            <div class="profile-preview-note">アイコンと表示名は、これから投稿するアイデアに使われます。</div>
          </div>
        </div>

        <div class="panel">
          <h3 class="panel-title">表示名</h3>
          <div class="field">
            <label for="nameInput">名前（20文字まで）</label>
            <input type="text" id="nameInput" maxlength="20" placeholder="name">
          </div>
        </div>

        <div class="panel">
          <h3 class="panel-title">アイコン</h3>

          <div class="field">
            <span class="field-label">好きな画像を使う</span>
            <input type="file" id="avatarFile" accept="image/*" hidden>
            <div class="avatar-actions">
              <button type="button" class="btn btn-ghost" id="avatarPick">画像を選ぶ</button>
              <button type="button" class="btn btn-ghost" id="avatarClear" hidden>画像を外す</button>
            </div>
            <p class="field-note" id="avatarNote">中央を正方形に切り抜いて縮小して保存します。</p>
          </div>

          <div class="field">
            <span class="field-label">画像を使わないときの色</span>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>

        <div class="profile-save">
          <button type="button" class="btn btn-primary" id="saveProfile">保存する</button>
          <span class="saved-msg" id="savedMsg" hidden>保存しました</span>
        </div>
      </section>

      <!-- 他の人のプロフィール -->
      <section class="view" id="view-user">
        <button type="button" class="back-link" id="userBack">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
          戻る
        </button>

        <div class="profile-preview">
          <span class="avatar avatar-lg" id="userAvatar"></span>
          <div class="profile-preview-body">
            <div class="profile-preview-name" id="userName"></div>
            <div class="profile-preview-note" id="userCount"></div>
          </div>
        </div>

        <div class="feed" id="userFeed"></div>
      </section>

      <!-- 通知 -->
      <section class="view" id="view-notice">
        <h2 class="view-title">通知</h2>
        <div class="notice-list" id="noticeList"></div>
      </section>

      <!-- 単体のアイデア（?idea=<ID> で開く） -->
      <section class="view" id="view-idea">
        <button type="button" class="back-link" id="ideaBack">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
          ホームへ
        </button>
        <div class="feed" id="ideaFeed"></div>
      </section>

      <!-- いいねした投稿 -->
      <section class="view" id="view-liked">
        <h2 class="view-title"><span class="nav-dot like"></span>いいねした投稿</h2>
        <p class="search-hint" id="likedHint"></p>
        <div class="feed" id="likedFeed"></div>
      </section>

      <!-- 開発中の投稿 -->
      <section class="view" id="view-dev">
        <h2 class="view-title"><span class="nav-dot dev"></span>開発中の投稿</h2>
        <p class="search-hint" id="devHint"></p>
        <div class="feed" id="devFeed"></div>
      </section>

      <!-- 完成した投稿 -->
      <section class="view" id="view-done">
        <h2 class="view-title"><span class="nav-dot done"></span>完成した投稿</h2>
        <p class="search-hint" id="doneHint"></p>
        <div class="feed" id="doneFeed"></div>
      </section>

      <!-- 設定 -->
      <section class="view" id="view-settings">
        <h2 class="view-title">設定</h2>

        <div class="panel panel-danger">
          <h3 class="panel-title">データ</h3>
          <p class="panel-note">アイデアの投稿はサーバーに保存され、全員に共有されます。<br>
            表示名とアイコンは、この端末のブラウザ内にのみ保存されます。</p>
          <button type="button" class="btn btn-danger" id="clearData">この端末の設定を削除</button>
        </div>
      </section>

    </main>

    <!-- ============ 広告エリア ============ -->
    <aside class="ad-rail" id="adRail">
      <div class="ad-sticky">
        <div class="ad-label">広告</div>

        <!-- 160×600 の広告枠。別の広告に差し替えるときは、
             下の admax タグを入れ替えたうえで
             idea.css の .ad-slot のサイズも合わせること。 -->
        <div class="ad-slot" id="adSlot">
          <!-- admax -->
          <script src="https://adm.shinobi.jp/s/8b86fdc38620220b5d69a5afdad58aa7"></script>
          <!-- admax -->
        </div>
      </div>
    </aside>

  </div>
</div>

<!-- モバイル用ボトムナビ -->
<nav class="mobile-nav" aria-label="モバイルナビゲーション">
  <button type="button" class="mnav-item is-active" data-view="home">ホーム</button>
  <button type="button" class="mnav-item" data-view="search">検索</button>
  <button type="button" class="mnav-item" data-view="notice">通知</button>
  <button type="button" class="mnav-item" data-view="liked"><span class="nav-dot like"></span>いいね</button>
  <button type="button" class="mnav-item" data-view="dev"><span class="nav-dot dev"></span>開発中</button>
  <button type="button" class="mnav-item" data-view="done"><span class="nav-dot done"></span>完成</button>
  <button type="button" class="mnav-item" data-view="settings">設定</button>
</nav>

<!-- ============ Firebase の初期化 ============
     idea.js は通常のスクリプトなので、ここで読み込んだ機能を
     window._fb にまとめて渡し、準備できたことを知らせる。 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    getFirestore, collection, doc, addDoc, setDoc, deleteDoc, updateDoc,
    getDoc, getDocs, query, where, orderBy, limit, startAfter,
    serverTimestamp, arrayUnion, arrayRemove
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  /* ▼▼▼ Firebaseコンソールで作ったプロジェクトの設定をここに貼り付ける ▼▼▼
     （loper 本体とは別のプロジェクトを使う） */
  const firebaseConfig = {
    apiKey:            "AIzaSyDFWN_SEPDAitfS0ckCL0e4OgyzJj9kO9w",
    authDomain:        "loper-ideashare.firebaseapp.com",
    projectId:         "loper-ideashare",
    storageBucket:     "loper-ideashare.firebasestorage.app",
    messagingSenderId: "424569289382",
    appId:             "1:424569289382:web:70ec468dbb8211edb2d267"
  };
  /* ▲▲▲ ここまで ▲▲▲ */

  window._fbConfigured = !firebaseConfig.apiKey.startsWith('ここに');

  if (window._fbConfigured) {
    try {
      const app = initializeApp(firebaseConfig);
      window._fb = {
        auth: getAuth(app),
        db: getFirestore(app),
        signInAnonymously, onAuthStateChanged,
        collection, doc, addDoc, setDoc, deleteDoc, updateDoc,
        getDoc, getDocs, query, where, orderBy, limit, startAfter,
        serverTimestamp, arrayUnion, arrayRemove
      };
    } catch (e) {
      window._fbError = e;
    }
  }

  document.dispatchEvent(new Event('firebase-ready'));
</script>

<script src="idea.js"></script>
</body>
</html>
